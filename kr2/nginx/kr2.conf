# /etc/nginx/sites-available/kr2 — ресурс kv.devops.local (КР2, вариант 4)

# Блок 1: перенаправление HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kv.devops.local;

    access_log /var/log/nginx/kr2.access.log;
    error_log  /var/log/nginx/kr2.error.log;

    return 301 https://$host$request_uri;
}

# Блок 2: обратный прокси-сервер к контейнеру приложения
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kv.devops.local;

    ssl_certificate     /etc/ssl/certs/kr2.crt;
    ssl_certificate_key /etc/ssl/private/kr2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/kr2.access.log;
    error_log  /var/log/nginx/kr2.error.log;

    location / {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
